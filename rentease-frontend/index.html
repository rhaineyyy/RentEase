<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>RentEase</title>

    <base href="/" />

    <meta name="color-scheme" content="light" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RentEase" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem('rentease_theme');
          var mode = saved === 'dark' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', mode);
          document.documentElement.style.colorScheme = mode;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <style>
      body {
        background: #f4f7fb;
        color: #0f172a;
      }

      html[data-theme="dark"] body {
        background: #0b0c10;
        color: #f3f4f6;
      }

      #rentease-startup {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        background:
          radial-gradient(circle at 50% 35%, rgba(6, 182, 212, 0.16), transparent 48%),
          linear-gradient(150deg, #f8fbff 0%, #edf4fc 64%, #e6f0fa 100%);
        color: #0f172a;
        text-align: center;
        font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif;
      }

      html[data-theme="dark"] #rentease-startup {
        background:
          radial-gradient(circle at 50% 35%, rgba(34, 211, 238, 0.2), transparent 48%),
          linear-gradient(150deg, #06090f 0%, #0e1320 64%, #090b10 100%);
        color: #fff;
      }

      #rentease-startup[hidden] {
        display: none;
      }

      .startup-properties {
        width: min(300px, 76vw);
        height: auto;
        overflow: hidden;
      }

      .startup-building {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: startup-rise 800ms cubic-bezier(.2, .85, .35, 1.16) both;
      }

      .startup-building:nth-of-type(2) {
        animation-delay: 140ms;
      }

      .startup-building:nth-of-type(3) {
        animation-delay: 280ms;
      }

      .startup-brand {
        font-size: 2.5rem;
        font-weight: 800;
        letter-spacing: -0.05em;
        color: #0f172a;
      }

      html[data-theme="dark"] .startup-brand {
        color: #ffffff;
      }

      .startup-brand em {
        font-style: normal;
        color: #06b6d4;
      }

      html[data-theme="dark"] .startup-brand em {
        color: #22d3ee;
      }

      .startup-message {
        font-size: 0.9rem;
        color: #64748b;
      }

      html[data-theme="dark"] .startup-message {
        color: #8b92a5;
      }

      @keyframes startup-rise {
        from {
          opacity: 0;
          transform: translateY(36px) scaleY(.2);
        }

        to {
          opacity: 1;
          transform: translateY(0) scaleY(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-building {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <div id="rentease-startup" role="status">
      <svg class="startup-properties" viewBox="0 0 300 158" aria-hidden="true">
        <circle cx="150" cy="75" r="66" fill="#22d3ee22" />

        <g class="startup-building">
          <path d="M108 145V45h79v100" fill="#1b263b" />
          <path d="M108 45l13-14h53l13 14z" fill="#06b6d4" />
          <path
            d="M122 60h17v15h-17zM156 60h17v15h-17zM122 86h17v15h-17zM156 86h17v15h-17z"
            fill="#22d3ee"
          />
          <path d="M139 116h18v29h-18z" fill="#8b5cf6" />
        </g>

        <g class="startup-building">
          <path d="M29 145V92l36-28 36 28v53z" fill="#24344d" />
          <path d="M21 94l44-38 44 38-7 8-37-31-37 31z" fill="#8b5cf6" />
          <path d="M42 106h15v14H42zM67 108h17v37H67z" fill="#22d3ee" />
        </g>

        <g class="startup-building">
          <path d="M198 145V88h63v57z" fill="#24344d" />
          <path d="M193 90l8-14h57l8 14z" fill="#38bdf8" />
          <path d="M208 100h13v12h-13zM238 100h13v12h-13z" fill="#38bdf8" />
          <path d="M223 122h14v23h-14z" fill="#8b5cf6" />
        </g>

        <path d="M18 146h264" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />
      </svg>

      <span class="startup-brand">RentEase<em>.</em></span>
      <span class="startup-message">Getting your space ready…</span>
    </div>

    <script>
      const startup = document.getElementById('rentease-startup');
      const appRoot = document.getElementById('app');
      const buildings = [...startup.querySelectorAll('.startup-building')];
      const minimumStartupTime = new Promise(resolve => setTimeout(resolve, 2500));

      const observer = new MutationObserver(() => {
        if (!appRoot.hasAttribute('data-v-app')) return;
        observer.disconnect();

        const animations = buildings.flatMap(building => building.getAnimations());
        const buildingsReady = Promise.allSettled(animations.map(animation => animation.finished));

        Promise.all([minimumStartupTime, buildingsReady]).then(() => {
          startup.hidden = true;
        });
      });

      observer.observe(appRoot, {
        attributes: true,
        attributeFilter: ['data-v-app'],
      });
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
